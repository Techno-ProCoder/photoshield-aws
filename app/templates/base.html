<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PhotoShield · see what your photos give away{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235b6cff' d='M12 2l8 3v6c0 5-3.5 9.3-8 11-4.5-1.7-8-6-8-11V5l8-3z'/%3E%3C/svg%3E">
<style>
  :root {
    --night: #0b1020; --night-2: #141b33; --night-line: #26304f;
    --ink: #151a2d; --muted: #5d6680; --line: #e3e7f0; --bg: #f3f5fa; --card: #fff;
    --accent: #5b6cff; --accent-2: #8a5bff; --accent-soft: #eef0ff;
    --danger: #d93a3f; --danger-soft: #fff0f0; --danger-line: #f6c9cb;
    --warn: #b76e00; --warn-soft: #fff7e6; --warn-line: #f6dcaa;
    --ok: #178a4e; --ok-soft: #ebf8f1; --ok-line: #bfe6cf;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink);
         background: var(--bg); line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }

  /* Header and hero */
  .top { background: var(--night); color: #e8ebf7; position: relative; overflow: hidden; }
  .top::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--night-line) 1px, transparent 1px),
                      linear-gradient(90deg, var(--night-line) 1px, transparent 1px);
    background-size: 36px 36px; opacity: .35;
    mask-image: radial-gradient(ellipse at 70% 0%, #000 20%, transparent 75%); }
  .top::after { content: ""; position: absolute; width: 520px; height: 520px; right: -140px; top: -260px;
    background: radial-gradient(circle, rgba(91,108,255,.45), transparent 65%); pointer-events: none; }
  .bar, .hero, main, footer { max-width: 920px; margin: 0 auto; padding-left: 1.25rem; padding-right: 1.25rem; }
  .bar { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between;
         gap: 1rem; padding-top: 1rem; padding-bottom: 1rem; flex-wrap: wrap; }
  .brand { display: inline-flex; align-items: center; gap: .5rem; color: #fff; text-decoration: none;
           font-weight: 700; font-size: 1.2rem; letter-spacing: -.01em; }
  .brand svg { width: 28px; height: 28px; }
  .brand span { color: #9aa6ff; }
  .served { display: inline-flex; align-items: center; gap: .45rem; font-size: .78rem; color: #aab3d1;
            background: var(--night-2); border: 1px solid var(--night-line); border-radius: 999px; padding: .3rem .75rem; }
  .served code { color: #dfe4ff; font-size: .78rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 3px rgba(61,220,132,.2); }
  .hero { position: relative; z-index: 1; padding-top: 2.2rem; padding-bottom: 5.5rem; }
  .eyebrow { display: inline-block; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
             color: #b8c0ff; background: rgba(91,108,255,.18); border: 1px solid rgba(154,166,255,.3);
             border-radius: 999px; padding: .25rem .7rem; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.1; letter-spacing: -.02em; margin: .9rem 0 .8rem; color: #fff; }
  .hero h1 em { font-style: normal; background: linear-gradient(90deg, #9aa6ff, #c49bff);
                -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { color: #b6bdd6; font-size: 1.08rem; max-width: 620px; margin: 0; }
  .hero.compact { padding-top: .5rem; padding-bottom: 4.5rem; }
  .hero.compact a { color: #b8c0ff; text-decoration: none; font-weight: 600; }

  /* Layout */
  main { position: relative; z-index: 2; margin-top: -3.5rem; padding-bottom: 2rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.4rem 1.5rem;
          margin-bottom: 1.1rem; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06); }
  .card h2 { font-size: 1.08rem; margin: 0 0 .9rem; letter-spacing: -.01em; }
  .muted { color: var(--muted); font-size: .9rem; }
  .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; border: 0; border-radius: 10px;
         padding: .75rem 1.25rem; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; color: #fff;
         background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px rgba(91,108,255,.3);
         transition: transform .12s ease, box-shadow .12s ease; }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(91,108,255,.38); }
  .btn.ghost { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
  .btn svg { width: 18px; height: 18px; }

  /* Alerts */
  .error { display: flex; gap: .6rem; align-items: center; background: var(--danger-soft); color: var(--danger);
           border: 1px solid var(--danger-line); border-radius: 10px; padding: .7rem 1rem; margin: 0 0 1rem; font-weight: 500; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .9rem; margin-bottom: 1.1rem; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; }
  .stat b { display: block; font-size: 1.75rem; letter-spacing: -.02em; line-height: 1.2; }
  .stat small { color: var(--muted); font-size: .85rem; }
  .stat.hot b { color: var(--danger); }

  /* Tables, lists, tags */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  td code { background: #f1f3f9; border-radius: 6px; padding: .1rem .4rem; font-size: .82rem; }
  .tag { display: inline-block; padding: .12rem .55rem; border-radius: 999px; font-size: .76rem; font-weight: 600; }
  .tag.yes { background: var(--danger-soft); color: var(--danger); }
  .tag.no { background: var(--ok-soft); color: var(--ok); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .55rem 1.25rem; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; font-weight: 500; }
  details { margin-top: 1rem; border-top: 1px dashed var(--line); padding-top: .8rem; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: .92rem; }

  footer { color: var(--muted); font-size: .82rem; padding-top: .5rem; padding-bottom: 2.5rem; text-align: center; }
  footer b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<header class="top">
  <nav class="bar">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#5b6cff" d="M12 2l8 3v6c0 5-3.5 9.3-8 11-4.5-1.7-8-6-8-11V5l8-3z"/><path fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <b>Photo<span>Shield</span></b>
    </a>
    <span class="served" title="The load balancer chose this server for your request">
      <span class="dot"></span>Served by <code>{{ instance_id }}</code> in <code>{{ az }}</code>
    </span>
  </nav>
  {% block hero %}{% endblock %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <b>PhotoShield</b> runs on AWS: a load balancer and auto-scaling servers in two Availability Zones,
  RDS MySQL and S3. Cleaned photos are deleted after 24 hours. Use it on your own photos.
</footer>
</body>
</html>
