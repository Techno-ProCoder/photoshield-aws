<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9z" fill="#3b4256"/>
    </marker>
    <style>
      .t { font-size: 15px; fill: #1b2230; }
      .th { font-size: 16px; font-weight: 700; fill: #1b2230; }
      .ts { font-size: 13px; fill: #4a5268; }
      .lbl { font-size: 13px; font-weight: 600; fill: #3b4256; }
      .edge { stroke: #3b4256; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#151a2d">PhotoShield on AWS: high-availability architecture</text>
  <text x="40" y="78" class="ts">All 39 resources are defined in Terraform. Arrows show request flow; labels show port and security-group rule.</text>

  <!-- Users -->
  <rect x="40" y="370" width="160" height="80" rx="10" fill="#f1f3f9" stroke="#8a93ab"/>
  <text x="120" y="403" class="th" text-anchor="middle">Users</text>
  <text x="120" y="425" class="ts" text-anchor="middle">browser / phone</text>

  <!-- Terraform -->
  <rect x="40" y="690" width="160" height="96" rx="10" fill="#f4efff" stroke="#7b42bc"/>
  <text x="120" y="722" class="th" text-anchor="middle">Terraform</text>
  <text x="120" y="744" class="ts" text-anchor="middle">on the laptop</text>
  <text x="120" y="764" class="ts" text-anchor="middle">plan / apply / destroy</text>

  <!-- Region -->
  <rect x="240" y="100" width="1120" height="770" rx="14" fill="#fbfcfe" stroke="#232f3e" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="260" y="126" class="th">AWS region us-east-1 (N. Virginia)</text>

  <!-- VPC -->
  <rect x="270" y="145" width="710" height="705" rx="12" fill="#f6f3ff" stroke="#8c4fff" stroke-width="1.5"/>
  <text x="290" y="170" class="th" fill="#5b2bb5">Default VPC</text>

  <!-- ALB -->
  <rect x="320" y="190" width="610" height="66" rx="10" fill="#efe8ff" stroke="#8c4fff" stroke-width="1.5"/>
  <text x="625" y="218" class="th" text-anchor="middle">Application Load Balancer</text>
  <text x="625" y="240" class="ts" text-anchor="middle">listener HTTP :80 · health check GET /health every 15 s · SG cloud-ha-alb-sg</text>

  <!-- AZ columns -->
  <rect x="295" y="280" width="320" height="550" rx="10" fill="#ffffff" stroke="#9aa3b8" stroke-dasharray="5 4"/>
  <text x="315" y="818" class="lbl">Availability Zone us-east-1a · public subnet</text>
  <rect x="635" y="280" width="320" height="550" rx="10" fill="#ffffff" stroke="#9aa3b8" stroke-dasharray="5 4"/>
  <text x="655" y="818" class="lbl">Availability Zone us-east-1b · public subnet</text>

  <!-- ASG -->
  <rect x="315" y="325" width="620" height="235" rx="10" fill="#fff6ec" stroke="#ed7100" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="335" y="349" class="lbl" fill="#a34e00">Auto Scaling group</text>
  <text x="520" y="349" class="ts" fill="#a34e00">min 2 · max 4 · target avg CPU 50%</text>

  <!-- EC2 a -->
  <rect x="345" y="370" width="240" height="160" rx="10" fill="#ffffff" stroke="#ed7100" stroke-width="1.5"/>
  <text x="465" y="400" class="th" text-anchor="middle">EC2 t3.micro</text>
  <text x="465" y="424" class="t" text-anchor="middle">PhotoShield</text>
  <text x="465" y="446" class="ts" text-anchor="middle">Flask + gunicorn :8000</text>
  <text x="465" y="466" class="ts" text-anchor="middle">Pillow image processing</text>
  <text x="465" y="486" class="ts" text-anchor="middle">IAM role · IMDSv2 only</text>
  <text x="465" y="506" class="ts" text-anchor="middle">SG cloud-ha-web-sg</text>

  <!-- EC2 b -->
  <rect x="665" y="370" width="240" height="160" rx="10" fill="#ffffff" stroke="#ed7100" stroke-width="1.5"/>
  <text x="785" y="400" class="th" text-anchor="middle">EC2 t3.micro</text>
  <text x="785" y="424" class="t" text-anchor="middle">PhotoShield</text>
  <text x="785" y="446" class="ts" text-anchor="middle">Flask + gunicorn :8000</text>
  <text x="785" y="466" class="ts" text-anchor="middle">Pillow image processing</text>
  <text x="785" y="486" class="ts" text-anchor="middle">IAM role · IMDSv2 only</text>
  <text x="785" y="506" class="ts" text-anchor="middle">SG cloud-ha-web-sg</text>

  <!-- RDS primary -->
  <rect x="345" y="640" width="240" height="150" rx="10" fill="#eef0ff" stroke="#3b48cc" stroke-width="1.5"/>
  <text x="465" y="670" class="th" text-anchor="middle">RDS MySQL 8.4</text>
  <text x="465" y="692" class="ts" text-anchor="middle">db.t3.micro · not public</text>
  <text x="465" y="712" class="ts" text-anchor="middle">encrypted · daily backups</text>
  <text x="465" y="732" class="ts" text-anchor="middle">table: scans (no coordinates)</text>
  <text x="465" y="752" class="ts" text-anchor="middle">SG cloud-ha-db-sg</text>

  <!-- RDS standby (future) -->
  <rect x="665" y="640" width="240" height="150" rx="10" fill="#ffffff" stroke="#3b48cc" stroke-dasharray="6 4"/>
  <text x="785" y="690" class="th" text-anchor="middle" fill="#5a63b8">Standby replica</text>
  <text x="785" y="712" class="ts" text-anchor="middle">Multi-AZ: future work</text>
  <text x="785" y="732" class="ts" text-anchor="middle">(multi_az = true)</text>

  <!-- Regional services -->
  <text x="1030" y="170" class="th">Regional services</text>
  <text x="1185" y="170" class="ts">(HTTPS, via IAM role)</text>
  <rect x="1030" y="190" width="300" height="96" rx="10" fill="#f2f8e9" stroke="#7aa116" stroke-width="1.5"/>
  <text x="1050" y="218" class="th">S3 bucket (private)</text>
  <text x="1050" y="240" class="ts">clean/ cleaned photos, deleted after 24 h</text>
  <text x="1050" y="260" class="ts">app/ application code · HTTPS only</text>
  <text x="1050" y="278" class="ts">downloads via 10-minute pre-signed URLs</text>

  <rect x="1030" y="306" width="300" height="76" rx="10" fill="#fdeef0" stroke="#dd344c" stroke-width="1.5"/>
  <text x="1050" y="334" class="th">Secrets Manager</text>
  <text x="1050" y="356" class="ts">DB password, generated and rotated by RDS</text>

  <rect x="1030" y="402" width="300" height="76" rx="10" fill="#fdeef0" stroke="#dd344c" stroke-width="1.5"/>
  <text x="1050" y="430" class="th">IAM instance role</text>
  <text x="1050" y="452" class="ts">least privilege: bucket, one secret, SSM</text>

  <rect x="1030" y="498" width="300" height="96" rx="10" fill="#fdeef6" stroke="#e7157b" stroke-width="1.5"/>
  <text x="1050" y="526" class="th">CloudWatch + SNS</text>
  <text x="1050" y="548" class="ts">dashboard · scaling alarms</text>
  <text x="1050" y="568" class="ts">alarms: unhealthy hosts, 5xx, DB CPU,</text>
  <text x="1050" y="586" class="ts">DB storage</text>

  <rect x="1030" y="614" width="300" height="76" rx="10" fill="#fdeef6" stroke="#e7157b" stroke-width="1.5"/>
  <text x="1050" y="642" class="th">Systems Manager</text>
  <text x="1050" y="664" class="ts">Session Manager shell: no SSH, no port 22</text>

  <!-- Edges: users to ALB -->
  <path class="edge" d="M120 370 V223 H318" marker-end="url(#arr)"/>
  <text x="128" y="192" class="lbl">HTTP :80</text>
  <text x="128" y="210" class="ts">from 0.0.0.0/0</text>

  <!-- ALB to instances -->
  <path class="edge" d="M500 256 V368" marker-end="url(#arr)"/>
  <path class="edge" d="M820 256 V368" marker-end="url(#arr)"/>
  <text x="508" y="300" class="lbl">:8000</text>
  <text x="828" y="300" class="lbl">:8000</text>

  <!-- Instances to RDS -->
  <path class="edge" d="M430 530 V638" marker-end="url(#arr)"/>
  <path class="edge" d="M750 530 V600 H540 V638" marker-end="url(#arr)"/>
  <text x="422" y="585" class="lbl" text-anchor="end">:3306 TLS</text>
  <text x="422" y="603" class="ts" text-anchor="end">from web SG only</text>

  <!-- Instances to regional services -->
  <path class="edge" d="M905 450 H1000"/>
  <path class="edge" d="M1000 238 V652"/>
  <path class="edge" d="M1000 238 H1028" marker-end="url(#arr)"/>
  <path class="edge" d="M1000 344 H1028" marker-end="url(#arr)"/>
  <path class="edge" d="M1000 440 H1028" marker-end="url(#arr)"/>
  <path class="edge" d="M1000 546 H1028" marker-end="url(#arr)"/>
  <path class="edge" d="M1000 652 H1028" marker-end="url(#arr)"/>

  <!-- Terraform to AWS -->
  <path d="M200 738 H238" stroke="#7b42bc" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
  <text x="120" y="812" class="ts" text-anchor="middle">AWS API (IAM user)</text>
</svg>
